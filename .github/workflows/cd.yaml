name: Deploy com Docker

on:
  push:
    branches:
      - main

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build da imagem Docker
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/oci-python-app-tsi:${{ github.sha }}

  deploy-to-instance:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      - name: Conectar à instância via SSH
        uses: appleboy/ssh-action@v0.1.4 
        with:
          host: ${{ secrets.OCI_INSTANCE_IP }}
          username: ${{ secrets.OCI_INSTANCE_USERNAME }}
          key: ${{ secrets.KEY }}
          script: |
            ssh -vvv ${{ secrets.OCI_INSTANCE_IP }}@${{ secrets.OCI_INSTANCE_USERNAME }}
            docker pull ${{ secrets.DOCKER_USERNAME }}/oci-python-app-tsi:${{ github.sha }}
            docker stop python-app
            docker rm python-app
            docker run -d --name python-app -p 8000:8000 ${{ secrets.DOCKER_USERNAME }}/oci-python-app-tsi:${{ github.sha }}