name: Deploy com Docker

on:
  push:
    branches:
      - main

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Login no Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build da imagem Docker
        uses: docker/build-push-action@v2
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/oci-python-app-tsi:${{ github.sha }}

  deploy-to-instance:
    runs-on: ubuntu-latest
    needs: build-and-push-image
    steps:
      - uses: actions/checkout@v4
      
      - name: Conectar à instância via SSH e executar comandos
        run: |
          echo "${{ secrets.KEY }}" > /tmp/private_key
          chmod 600 /tmp/private_key  
          ssh -i /tmp/private_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ${{ secrets.OCI_INSTANCE_USERNAME }}@${{ secrets.OCI_INSTNACE_IP }} << EOF
            docker pull ${{ secrets.DOCKER_USERNAME }}/oci-python-app-tsi:${{ github.sha }}
            docker stop python-app
            docker rm python-app
            docker run -d --name python-app -p 8000:8000 ${{ secrets.DOCKER_USERNAME }}/oci-python-app-tsi:${{ github.sha }}
          EOF

      - name: Limpa o arquivo de chave privada após uso
        run: |
           rm /tmp/private_key